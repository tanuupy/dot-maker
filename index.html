<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>ドット絵メイカー</title>
<style>
:root{
  --bg:#eef4f7; --panel:#fff; --line:#cfdbe3; --text:#24323d; --sub:#5f7485; --accent:#3aa6b9;
  --shadow:0 4px 10px rgba(25,50,70,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#f8fbfd 0%,var(--bg) 100%);color:var(--text);touch-action:manipulation;-webkit-text-size-adjust:100%}
.wrap{width:100vw;margin:0 auto;padding:0 4px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:14px;line-height:1.1}
.workspace{display:grid;gap:6px;max-height:100vh;overflow-y:auto}
.top-row{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:6px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;box-shadow:var(--shadow)}
.grid2,.grid3,.grid4{display:grid;gap:4px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:4px 5px;cursor:pointer;transition:.12s ease;font-size:10px;line-height:1.1;min-height:24px}
button:hover{transform:translateY(-1px);border-color:var(--accent)}
button.active{background:linear-gradient(180deg,#dff8fc 0%,#c7f1f8 100%);border-color:var(--accent);color:#0f5160;font-weight:700}
button.wide{grid-column:1/-1}
.top-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool-edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.color-row{display:grid;grid-template-columns:44px 1fr 44px;gap:5px;align-items:center}
#colorPicker,#bgColorPicker{width:44px;height:28px;padding:1px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.meta{display:grid;gap:2px;font-size:10px}
.label{color:var(--sub);font-size:10px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:5px}
.swatch{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid rgba(0,0,0,.14);min-height:auto;padding:0}
.palette-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:5px}
.preview-frame{border:1px solid var(--line);border-radius:8px;background:#f9fcfe;display:flex;justify-content:center;align-items:center;width:136px;height:136px;margin:auto;padding:2px;box-sizing:border-box;overflow:hidden}
.preview-mini{display:grid;justify-items:center;gap:2px}
.preview-mini .mini{font-size:8px;line-height:1}
.canvas-shell{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start}
.canvas-panel{display:block;width:100%}
.canvas-wrap{position:sticky;top:0;z-index:10;width:calc(100vw - 16px);height:calc(100vw - 16px);margin:8px auto;display:block;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#editorCanvas{display:block;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;margin:0}
.canvas-stage{min-width:100%;min-height:100%;display:grid;place-items:center}
.canvas-zoom-controls{position:absolute;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(2,32px);gap:6px;z-index:12}
.canvas-zoom-controls button{min-height:32px;padding:0;font-size:18px;font-weight:700;background:rgba(255,255,255,.95)}box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.info{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;color:var(--sub);font-size:9px}
.side-stack{display:grid;gap:6px}
.side-card{border:1px solid var(--line);border-radius:8px;padding:5px;background:#f9fcfe}
.side-card .tiny-title{display:none}
#previewCanvas{width:100%;height:100%;max-width:100%;max-height:100%;border:none;display:block;background:transparent;touch-action:none;cursor:pointer}
.preview-box{display:grid;justify-items:center;gap:4px}
.inline{display:flex;gap:6px;align-items:center;justify-content:space-between;color:var(--sub);font-size:10px}
.inline input[type=file]{max-width:108px;font-size:10px}
.coords,.smallbox{font-size:10px;color:var(--sub);background:#f6fafc;border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.mini{color:var(--sub);font-size:9px;line-height:1.35;margin:0}
.frames-head{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:5px}
.frames-head span{font-size:9px;color:var(--sub)}
#framesStrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.frame-card{border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;display:grid;gap:4px;cursor:pointer}
.frame-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,166,185,.15) inset;background:#f5fdff}
.frame-thumb{width:100%;aspect-ratio:1;border:1px solid #b6c8d4;border-radius:6px;background:linear-gradient(45deg,#edf3f7 25%,transparent 25%,transparent 75%,#edf3f7 75%),linear-gradient(45deg,#edf3f7 25%,transparent 25%,transparent 75%,#edf3f7 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.frame-name{font-size:10px;text-align:center;color:var(--sub)}
.slot-list{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:6px}
.slot-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.slot-card{border:1px solid var(--line);border-radius:5px;padding:2px;background:#fff;display:grid;gap:2px;box-shadow:none}
.slot-top{display:flex;justify-content:center;align-items:center;font-size:8px;color:var(--sub)}
.slot-thumb{width:100%;aspect-ratio:1;border:1px solid #b6c8d4;border-radius:4px;background:linear-gradient(45deg,#edf3f7 25%,transparent 25%,transparent 75%,#edf3f7 75%),linear-gradient(45deg,#edf3f7 25%,transparent 25%,transparent 75%,#edf3f7 75%);background-size:6px 6px;background-position:0 0,3px 3px}
.slot-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.preview-frame + .slot-actions{grid-template-columns:repeat(2,minmax(0,1fr));}
.slot-actions button{font-size:8px;padding:3px 1px;min-height:20px;display:block}
.slot-card.selected{outline:2px solid var(--accent);background:#f3fdff}
.slot-thumb-wrap{position:relative}
.slot-delete{position:absolute;top:3px;right:3px;min-height:18px;font-size:9px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,.9)}
.save-grid{display:grid;gap:6px}
.hidden-title{display:none}

.preview-mini{display:grid;justify-items:center;gap:2px}
.preview-mini .mini{font-size:8px;line-height:1}
.template-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.io-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.read-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.read-btn{display:grid;gap:3px;align-items:center;justify-items:stretch}
.read-btn span{font-size:10px;color:var(--sub);text-align:center}
.read-btn input[type=file]{width:100%;font-size:9px}

@media (max-width:700px){
  .wrap{width:100vw;margin:0 auto;padding:0 4px;box-sizing:border-box}
  .canvas-shell{grid-template-columns:minmax(0,1fr) 102px}
  #previewCanvas{width:100%;height:100%;max-width:100%;max-height:100%;border:none;display:block;background:transparent;touch-action:none;cursor:pointer}
  button{font-size:10px;padding:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>ドット絵メイカー</h1>
  <div class="workspace">

    <section class="panel">
      <div class="top-tools">
        <div class="tool-edit-grid">
          <button id="toolBrush" class="active">ペン</button>
          <button id="toolEraser">消しゴム</button>
          <button id="toolEyedropper">スポイト</button>
          <button id="toolFill">塗りつぶし</button>
          <button id="toolSelect">選択</button>
          <button id="toggleSymmetry">左右対称OFF</button>
          <button id="toggleGrid" class="wide active">グリッド表示</button>
        </div>
        <div class="tool-edit-grid">
          <button id="undoBtn">元に戻す</button>
          <button id="redoBtn">やり直す</button>
          <button id="flipBtn">左右反転</button>
          <button id="copyBtn">選択コピー</button>
          <button id="pasteBtn">貼り付け</button>
          <button id="clearBtn">全消去</button>
        </div>
      </div>
    </section>

    <div class="top-row">
      <section class="panel">
        <div class="color-row">
          <input id="colorPicker" type="color" value="#5b3a29"/>
          <div class="meta">
            <div><strong>現在色</strong> <span id="hexLabel">#5B3A29</span></div>
            <div class="label" id="modeLabel">ペンで描画</div>
          </div>
          <input id="bgColorPicker" type="color" value="#ffffff" title="背景色"/>
        </div>
        <div class="swatches" id="swatches"></div>
<div class="swatches" id="recentColors"></div>
        <div class="palette-row">
          <button data-palette="basic">ベーシック</button>
          <button data-palette="skin">肌・髪</button>
          <button data-palette="school">制服</button>
          <button data-palette="fantasy">ファンタジー</button>
        </div>
      </section>

      <section class="panel">
        <div class="preview-frame">
          <div class="preview-mini">
            <canvas id="previewCanvas" width="32" height="32"></canvas>
          </div>
        </div>
        <div class="slot-actions" style="margin-top:4px">
          <button id="previewZoomOutBtn" type="button">−</button>
          <button id="previewZoomInBtn" type="button">＋</button>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="canvas-shell">
        <div class="canvas-panel">
          <div class="canvas-wrap" id="canvasViewport"><div class="canvas-stage" id="canvasStage"><canvas id="editorCanvas" width="640" height="640"></canvas></div><div class="canvas-zoom-controls"><button id="zoomOutBtn" type="button">−</button><button id="zoomInBtn" type="button">＋</button></div></div>
          
        </div>
      </div>
    

    <section class="panel" style="padding:6px">
      

      <div class="slot-top"><span>仮保存BOX</span><button id="clearBgRef">背景リセット</button></div>
      <div class="slot-actions" style="margin-top:4px">
        <button id="slotSaveBtn" type="button">保存</button>
        <button id="slotLoadBtn" type="button">読込</button>
        <button id="slotBgBtn" type="button">背景化</button>
        <button id="slotDeleteBtn" type="button">消去</button>
      </div>
      <div class="slot-list" id="slotList"></div>
    </section>

    <section class="panel save-grid">
      <div class="grid3">
        <button data-size="32" class="sizeBtn active">32</button>
        <button data-size="64" class="sizeBtn">64</button>
        <button data-size="128" class="sizeBtn">128</button>
      </div>
      <div class="template-row" style="margin-top:6px">
        <button id="loadBasic">男の子</button>
        <button id="loadSeirist">女の子</button>
        <button id="loadFace">顔だけ</button>
        <button id="loadBlank">まっさら</button>
      </div>

      <div class="read-row">
        <label class="read-btn"><span>PNG読込</span><input id="uploadPng" type="file" accept="image/png"/></label>
        <label class="read-btn"><span>JSON読込</span><input id="uploadJson" type="file" accept="application/json"/></label>
      </div>

      <div class="grid2" style="margin-top:6px">
        <button id="downloadPng">PNG保存</button>
        <button id="downloadJson">JSON保存</button>
      </div>
      <div class="label" id="saveStatus">自動保存あり</div>

      <div class="inline"><span><span id="zoomLabel">20</span>倍</span><input id="zoomSlider" type="range" min="6" max="28" step="1" value="24"/></div>
      <div class="coords" id="coords">x: - / y: -</div>

      <div>
        <div class="frames-head"><span id="frameSummary">1フレーム</span><span><span id="fpsLabel">6</span>fps</span></div>
        <div class="grid2" style="margin-bottom:6px">
          <button id="addFrame">追加</button>
          <button id="duplicateFrame">複製</button>
          <button id="deleteFrame">削除</button>
          <button id="playAnim">再生</button>
        </div>
        <input id="fpsSlider" type="range" min="1" max="16" step="1" value="6" style="width:100%;margin-bottom:6px"/>
        <div id="framesStrip"></div>
      </div>
    </section>

  </div>
</div>

function showSaveStatus(message, strong=false){
  const el=document.getElementById('saveStatus');
  if(!el)return;
  el.textContent=message;
  el.style.color=strong?'#0f5160':'var(--sub)';
}
function persistProject(){
  try{
    localStorage.setItem(LOCAL_PROJECT_KEY, JSON.stringify({size,frames,backgroundColor,currentFrame,slots}));
    showSaveStatus('自動保存済み', true);
  }catch(err){
    showSaveStatus('保存失敗');
    console.error(err);
  }
}
function restoreProject(){
  try{
    const raw=localStorage.getItem(LOCAL_PROJECT_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data || !data.size || !data.frames)return false;
    size=Number(data.size)||32;
    frames=(data.frames||[]).map((f,i)=>({name:f.name||`F${i+1}`,pixels:f.pixels})).filter(f=>f.pixels);
    if(!frames.length)frames=[{name:'F1',pixels:createBlank(size)}];
    currentFrame=Math.max(0,Math.min(Number(data.currentFrame)||0,frames.length-1));
    backgroundColor=(data.backgroundColor||'#FFFFFF').toUpperCase();
    bgColorPicker.value=backgroundColor;
    slots=(data.slots||Array.from({length:20},()=>null)).map(s=>s||null); while(slots.length<20) slots.push(null);
    document.querySelectorAll('.sizeBtn').forEach(b=>b.classList.toggle('active',Number(b.dataset.size)===size));
    showSaveStatus('自動保存を復元', true);
    return true;
  }catch(err){
    console.error(err);
    showSaveStatus('復元失敗');
    return false;
  }
}
function triggerDownload(filename, href, revoke=false){
  const a=document.createElement('a');
  a.href=href;
  a.download=filename;
  a.rel='noopener';
  a.style.display='none';
  document.body.appendChild(a);
  requestAnimationFrame(()=>{
    a.click();
    setTimeout(()=>{
      a.remove();
      if(revoke) URL.revokeObjectURL(href);
    }, 300);
  });
  showSaveStatus(filename+' を保存', true);
}

    startScrollLeft:canvasViewport.scrollLeft,

  if(!slots[i]){ showSaveStatus(`保存${i+1} は空です`); return; }
  pushHistory();
  setPixels(clonePixels(slots[i]));
  clearSelection();
  drawEditor();
  persistProject();
  showSaveStatus(`保存${i+1} を読込`, true);
}
function setBgFromSlot(i){
  bgReference=slots[i]?clonePixels(slots[i]):null;
  drawEditor();
  persistProject();
  showSaveStatus(slots[i]?`保存${i+1} を背景化`:'背景なし', true);
}
function deleteSlot(i){
  slots[i]=null;
  if(selectedSlotIndex===i) selectedSlotIndex=null;
  renderSlots();
  persistProject();
  showSaveStatus(`保存${i+1} を消去`, true);
}
function addFrame(duplicate=false){stopPlayback(); const source=duplicate?clonePixels(getPixels()):createBlank(size); frames.splice(currentFrame+1,0,{name:`F${frames.length+1}`,pixels:source}); currentFrame++; history=[]; future=[]; clearSelection(); frames.forEach((f,i)=>f.name=`F${i+1}`); drawEditor(); renderRecentColors(); persistProject();}
function deleteFrame(){if(frames.length===1){blankCurrent(); return;} stopPlayback(); frames.splice(currentFrame,1); currentFrame=Math.max(0,currentFrame-1); frames.forEach((f,i)=>f.name=`F${i+1}`); history=[]; future=[]; clearSelection(); drawEditor(); renderRecentColors(); persistProject();}
function stopPlayback(){if(playTimer){clearInterval(playTimer); playTimer=null; playAnimBtn.textContent='再生';}}
function togglePlayback(){if(playTimer){stopPlayback(); drawEditor(); renderRecentColors(); return;} let i=currentFrame; playAnimBtn.textContent='停止'; playTimer=setInterval(()=>{i=(i+1)%frames.length; currentFrame=i; clearSelection(); drawEditor(); renderRecentColors();},1000/Number(fpsSlider.value));}


function getPreferredSaveSlot(){
  if(selectedSlotIndex!==null) return selectedSlotIndex;
  const emptyIndex = slots.findIndex(s=>!s);
  return emptyIndex>=0 ? emptyIndex : 0;
}

// events
Object.entries(toolButtons).forEach(([k,b])=>b.onclick=()=>setTool(k));
toggleGrid.onclick=()=>{showGrid=!showGrid; toggleGrid.classList.toggle('active',showGrid); drawEditor(); renderRecentColors();};
toggleSymmetry.onclick=()=>{symmetry=!symmetry; toggleSymmetry.textContent=symmetry?'左右対称ON':'左右対称OFF'; toggleSymmetry.classList.toggle('active',symmetry); drawEditor(); renderRecentColors();};
colorPicker.oninput=e=>setColor(e.target.value);
bgColorPicker.oninput=e=>{backgroundColor=e.target.value.toUpperCase(); drawEditor(); renderRecentColors(); persistProject();};
zoomSlider.oninput=e=>setZoomScale(Number(e.target.value));
fpsSlider.oninput=e=>{fpsLabel.textContent=e.target.value; if(playTimer){togglePlayback(); togglePlayback();}};
document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>makeSwatches(b.dataset.palette));
document.querySelectorAll('.sizeBtn').forEach(b=>b.onclick=()=>changeSize(Number(b.dataset.size)));
loadBasic.onclick=()=>loadTemplate('basic'); loadSeirist.onclick=()=>loadTemplate('seirist'); loadFace.onclick=()=>loadTemplate('face'); loadBlank.onclick=()=>blankCurrent();
undoBtn.onclick=undo; redoBtn.onclick=redo; flipBtn.onclick=flipHorizontal; clearBtn.onclick=blankCurrent; copyBtn.onclick=copySelection; pasteBtn.onclick=pasteClipboard;
downloadPngBtn.onclick=downloadPng; downloadJsonBtn.onclick=downloadJson; uploadJson.onchange=e=>e.target.files[0]&&importJson(e.target.files[0]); uploadPng.onchange=e=>e.target.files[0]&&importPng(e.target.files[0]);
document.querySelectorAll('[data-slot-save]').forEach(b=>b.onclick=()=>saveSlot(Number(b.dataset.slotSave)));
document.querySelectorAll('[data-slot-load]').forEach(b=>b.onclick=()=>loadSlot(Number(b.dataset.slotLoad)));
document.querySelectorAll('[data-slot-bg]').forEach(b=>b.onclick=()=>setBgFromSlot(Number(b.dataset.slotBg)));
clearBgRef.onclick=()=>{bgReference=null; drawEditor(); renderRecentColors(); persistProject(); showSaveStatus('背景をリセット', true);};
slotSaveBtn.onclick=()=>saveSlot(getPreferredSaveSlot());
slotLoadBtn.onclick=()=>{ if(selectedSlotIndex===null){ showSaveStatus('スロットを選択してください'); return; } loadSlot(selectedSlotIndex); };
slotBgBtn.onclick=()=>{ if(selectedSlotIndex===null){ showSaveStatus('スロットを選択してください'); return; } setBgFromSlot(selectedSlotIndex); };
slotDeleteBtn.onclick=()=>{ if(selectedSlotIndex===null){ showSaveStatus('スロットを選択してください'); return; } deleteSlot(selectedSlotIndex); };
addFrameBtn.onclick=()=>addFrame(false); duplicateFrameBtn.onclick=()=>addFrame(true); deleteFrameBtn.onclick=deleteFrame; playAnimBtn.onclick=togglePlayback;
canvasViewport.addEventListener('scroll',()=>drawPreview());
previewCanvas.addEventListener('click',jumpViewportFromPreviewEvent);
previewCanvas.addEventListener('touchstart',e=>{if(e.touches.length===1){e.preventDefault(); jumpViewportFromPreviewEvent(e);}}, {passive:false});
previewCanvas.addEventListener('touchmove',e=>{if(e.touches.length===1){e.preventDefault(); jumpViewportFromPreviewEvent(e);}}, {passive:false});
zoomInBtn.onclick=()=>setZoomScale(scale+2);
zoomOutBtn.onclick=()=>setZoomScale(scale-2);
previewZoomInBtn.onclick=()=>setZoomScale(scale+2);
previewZoomOutBtn.onclick=()=>setZoomScale(scale-2);
editorCanvas.addEventListener('mousedown',startDraw); editorCanvas.addEventListener('mousemove',moveDraw); window.addEventListener('mouseup',endDraw); editorCanvas.addEventListener('mouseleave',()=>{if(!isDrawing&&currentTool!=='select')coords.textContent='x: - / y: -';});
canvasViewport.addEventListener('touchstart',e=>{
  if(e.touches.length===2){handlePinchStart(e);}
},{passive:false});
canvasViewport.addEventListener('touchmove',e=>{
  if(e.touches.length===2){handlePinchMove(e);}
},{passive:false});
canvasViewport.addEventListener('touchend',handlePinchEnd,{passive:false});
canvasViewport.addEventListener('touchcancel',handlePinchEnd,{passive:false});
editorCanvas.addEventListener('touchstart',startDraw,{passive:false}); editorCanvas.addEventListener('touchmove',moveDraw,{passive:false}); window.addEventListener('touchend',e=>{ endDraw(); if(!e.touches || e.touches.length===0){ setTimeout(()=>{ isTwoFingerGesture=false; }, 30); } });
document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<300){ e.preventDefault(); } lastTouchEnd=now; }, {passive:false});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();} else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();} else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){if(selection){e.preventDefault();copySelection();}} else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){if(clipboard){e.preventDefault();pasteClipboard();}}});

makeSwatches('basic');
const restored=restoreProject();
if(!restored) loadTemplate('girl');
zoomLabel.textContent=Math.round(scale); fpsLabel.textContent=fpsSlider.value; drawEditor(); renderRecentColors(); renderSlots();
</script>
</body>
</html>
